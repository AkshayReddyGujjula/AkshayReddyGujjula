<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">UnDiffused</title>
  <desc id="desc">On-device AI image detection with measured performance, local inference and calibrated uncertainty.</desc>
  <defs>
    <linearGradient id="background" x1="70" y1="20" x2="1130" y2="340" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07111F"/>
      <stop offset="0.5" stop-color="#111A35"/>
      <stop offset="1" stop-color="#231044"/>
    </linearGradient>
    <linearGradient id="accent" x1="265" y1="58" x2="779" y2="212" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset="0.52" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#C084FC"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientTransform="translate(955 76) rotate(138) scale(425 264)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8B5CF6" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientTransform="translate(163 305) rotate(-36) scale(403 251)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0EA5E9" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#0EA5E9" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="9" stdDeviation="18" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#E2E8F0" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#background)"/>
  <rect width="1200" height="360" rx="28" fill="url(#glowA)"/>
  <rect width="1200" height="360" rx="28" fill="url(#glowB)"/>
  <rect width="1200" height="360" rx="28" fill="url(#grid)"/>

  <g transform="translate(68 63)" filter="url(#shadow)">
    <rect width="78" height="78" rx="22" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.16"/>
    <path d="M20 28V20H28M50 20H58V28M58 50V58H50M28 58H20V50" fill="none" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
    <circle cx="39" cy="39" r="11" fill="none" stroke="#F8FAFC" stroke-width="4"/>
    <circle cx="39" cy="39" r="3.5" fill="#38BDF8"/>
  </g>

  <text x="174" y="102" fill="#F8FAFC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="50" font-weight="760" letter-spacing="1.5">UnDiffused</text>
  <rect x="174" y="119" width="432" height="4" rx="2" fill="url(#accent)"/>
  <text x="68" y="186" fill="#CBD5E1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="500">On-device AI image detection, rebuilt from first principles.</text>
  <text x="68" y="224" fill="#94A3B8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17">Measured honestly. Calibrated for uncertainty. Shipped in the browser.</text>

  <g transform="translate(68 270)" font-family="Inter, Segoe UI, Arial, sans-serif">
    <g>
      <rect width="234" height="58" rx="14" fill="#0F172A" fill-opacity="0.72" stroke="#38BDF8" stroke-opacity="0.35"/>
      <text x="18" y="25" fill="#38BDF8" font-size="12" font-weight="700" letter-spacing="1.2">EXTERNAL AUROC</text>
      <text x="18" y="47" fill="#F8FAFC" font-size="21" font-weight="720">0.954</text>
    </g>
    <g transform="translate(250 0)">
      <rect width="234" height="58" rx="14" fill="#0F172A" fill-opacity="0.72" stroke="#818CF8" stroke-opacity="0.35"/>
      <text x="18" y="25" fill="#A5B4FC" font-size="12" font-weight="700" letter-spacing="1.2">SHIPPED MODEL</text>
      <text x="18" y="47" fill="#F8FAFC" font-size="21" font-weight="720">24.9 MB INT8</text>
    </g>
    <g transform="translate(500 0)">
      <rect width="234" height="58" rx="14" fill="#0F172A" fill-opacity="0.72" stroke="#A78BFA" stroke-opacity="0.35"/>
      <text x="18" y="25" fill="#C4B5FD" font-size="12" font-weight="700" letter-spacing="1.2">EVALUATION</text>
      <text x="18" y="47" fill="#F8FAFC" font-size="21" font-weight="720">400 matched pairs</text>
    </g>
    <g transform="translate(750 0)">
      <rect width="314" height="58" rx="14" fill="#0F172A" fill-opacity="0.72" stroke="#C084FC" stroke-opacity="0.35"/>
      <text x="18" y="25" fill="#D8B4FE" font-size="12" font-weight="700" letter-spacing="1.2">RUNTIME</text>
      <text x="18" y="47" fill="#F8FAFC" font-size="21" font-weight="720">ONNX Runtime Web + WASM</text>
    </g>
  </g>

  <rect x="0.75" y="0.75" width="1198.5" height="358.5" rx="27.25" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1.5"/>
</svg>
