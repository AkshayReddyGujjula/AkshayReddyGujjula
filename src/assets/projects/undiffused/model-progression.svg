<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">UnDiffused model progression</title>
  <desc id="desc">Measured AUROC improved from the chance-level v1 audit to 0.894 for the content-matched DINOv2 probe and 0.954 for the shipping fine-tuned detector.</desc>
  <defs>
    <linearGradient id="bg" x1="24" y1="20" x2="930" y2="338" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1220"/>
      <stop offset="1" stop-color="#17112B"/>
    </linearGradient>
    <linearGradient id="barA" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#334155"/>
      <stop offset="1" stop-color="#64748B"/>
    </linearGradient>
    <linearGradient id="barB" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#0EA5E9"/>
      <stop offset="1" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="barC" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#6366F1"/>
      <stop offset="1" stop-color="#C084FC"/>
    </linearGradient>
  </defs>

  <rect width="960" height="360" rx="24" fill="url(#bg)"/>
  <text x="42" y="52" fill="#F8FAFC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">Measured model progression</text>
  <text x="42" y="79" fill="#94A3B8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">Primary measured AUROC at each stage, where 0.500 is chance</text>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <line x1="220" y1="107" x2="220" y2="304" stroke="#64748B" stroke-opacity="0.45"/>
    <line x1="402" y1="107" x2="402" y2="304" stroke="#64748B" stroke-opacity="0.25" stroke-dasharray="4 6"/>
    <line x1="583" y1="107" x2="583" y2="304" stroke="#64748B" stroke-opacity="0.25" stroke-dasharray="4 6"/>
    <line x1="765" y1="107" x2="765" y2="304" stroke="#64748B" stroke-opacity="0.25" stroke-dasharray="4 6"/>
    <line x1="910" y1="107" x2="910" y2="304" stroke="#64748B" stroke-opacity="0.45"/>

    <text x="220" y="327" fill="#64748B" font-size="12" text-anchor="middle">0.50</text>
    <text x="402" y="327" fill="#64748B" font-size="12" text-anchor="middle">0.625</text>
    <text x="583" y="327" fill="#64748B" font-size="12" text-anchor="middle">0.75</text>
    <text x="765" y="327" fill="#64748B" font-size="12" text-anchor="middle">0.875</text>
    <text x="910" y="327" fill="#64748B" font-size="12" text-anchor="middle">0.975</text>

    <text x="42" y="139" fill="#CBD5E1" font-size="14" font-weight="650">v1 shipped</text>
    <text x="42" y="157" fill="#64748B" font-size="12">2 x ViT-B/16</text>
    <rect x="220" y="126" width="4" height="36" rx="3" fill="url(#barA)"/>
    <text x="236" y="150" fill="#CBD5E1" font-size="15" font-weight="700">0.500</text>

    <text x="42" y="212" fill="#CBD5E1" font-size="14" font-weight="650">v2 probe</text>
    <text x="42" y="230" fill="#64748B" font-size="12">Frozen DINOv2</text>
    <rect x="220" y="199" width="573" height="36" rx="8" fill="url(#barB)"/>
    <text x="805" y="223" fill="#BAE6FD" font-size="15" font-weight="700">0.894</text>

    <text x="42" y="285" fill="#F8FAFC" font-size="14" font-weight="700">v2 shipping</text>
    <text x="42" y="303" fill="#A5B4FC" font-size="12">Fine-tuned DINOv2</text>
    <rect x="220" y="272" width="660" height="36" rx="8" fill="url(#barC)"/>
    <text x="893" y="296" fill="#F3E8FF" font-size="15" font-weight="750">0.954</text>
  </g>

  <rect x="0.75" y="0.75" width="958.5" height="358.5" rx="23.25" fill="none" stroke="#FFFFFF" stroke-opacity="0.11" stroke-width="1.5"/>
</svg>
