<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">UnDiffused system architecture</title>
  <desc id="desc">A selected image passes through the Manifest V3 service worker, URL guard, closed Shadow DOM, Web Worker and local DINOv2 model before a calibrated three-state verdict is shown. Crop scores and forensic tools remain supporting evidence.</desc>
  <defs>
    <linearGradient id="bg" x1="42" y1="18" x2="1150" y2="604" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07111F"/>
      <stop offset="0.54" stop-color="#10182F"/>
      <stop offset="1" stop-color="#241039"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#38BDF8"/>
      <stop offset="0.55" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#C084FC"/>
    </linearGradient>
    <linearGradient id="score" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#2DD4BF"/>
      <stop offset="0.48" stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#F472B6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(1040 102) rotate(140) scale(500 300)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8B5CF6" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#E2E8F0" stroke-opacity="0.045"/>
    </pattern>
    <filter id="shadow" x="-25%" y="-40%" width="150%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="13" flood-color="#020617" flood-opacity="0.42"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#818CF8"/>
    </marker>
  </defs>

  <rect width="1200" height="620" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="620" rx="28" fill="url(#glow)"/>
  <rect width="1200" height="620" rx="28" fill="url(#grid)"/>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="48" y="56" fill="#F8FAFC" font-size="25" font-weight="730">From click to calibrated verdict</text>
    <text x="48" y="83" fill="#94A3B8" font-size="14">The shipping browser path, with verdict and supporting evidence kept separate</text>

    <g font-size="11" font-weight="700" letter-spacing="1.2">
      <rect x="48" y="108" width="198" height="28" rx="14" fill="#0EA5E9" fill-opacity="0.13" stroke="#38BDF8" stroke-opacity="0.32"/>
      <text x="147" y="127" fill="#7DD3FC" text-anchor="middle">USER ACTION</text>
      <rect x="270" y="108" width="198" height="28" rx="14" fill="#6366F1" fill-opacity="0.13" stroke="#818CF8" stroke-opacity="0.32"/>
      <text x="369" y="127" fill="#A5B4FC" text-anchor="middle">PRIVILEGED CONTEXT</text>
      <rect x="492" y="108" width="198" height="28" rx="14" fill="#8B5CF6" fill-opacity="0.13" stroke="#A78BFA" stroke-opacity="0.32"/>
      <text x="591" y="127" fill="#C4B5FD" text-anchor="middle">ISOLATED UI</text>
      <rect x="714" y="108" width="438" height="28" rx="14" fill="#A855F7" fill-opacity="0.13" stroke="#C084FC" stroke-opacity="0.32"/>
      <text x="933" y="127" fill="#D8B4FE" text-anchor="middle">LOCAL COMPUTE</text>
    </g>

    <g filter="url(#shadow)">
      <g transform="translate(48 157)">
        <rect width="198" height="122" rx="18" fill="#0F172A" fill-opacity="0.86" stroke="#38BDF8" stroke-opacity="0.38"/>
        <circle cx="28" cy="28" r="14" fill="#0EA5E9" fill-opacity="0.22"/>
        <text x="28" y="33" fill="#7DD3FC" font-size="14" font-weight="750" text-anchor="middle">1</text>
        <text x="20" y="67" fill="#F8FAFC" font-size="16" font-weight="700">Selected image</text>
        <text x="20" y="91" fill="#94A3B8" font-size="12">Context menu or local</text>
        <text x="20" y="108" fill="#94A3B8" font-size="12">file picker</text>
      </g>
      <g transform="translate(270 157)">
        <rect width="198" height="122" rx="18" fill="#0F172A" fill-opacity="0.86" stroke="#818CF8" stroke-opacity="0.38"/>
        <circle cx="28" cy="28" r="14" fill="#6366F1" fill-opacity="0.24"/>
        <text x="28" y="33" fill="#A5B4FC" font-size="14" font-weight="750" text-anchor="middle">2</text>
        <text x="20" y="67" fill="#F8FAFC" font-size="16" font-weight="700">MV3 service worker</text>
        <text x="20" y="91" fill="#94A3B8" font-size="12">URL and redirect guard</text>
        <text x="20" y="108" fill="#94A3B8" font-size="12">Credential-free retrieval</text>
      </g>
      <g transform="translate(492 157)">
        <rect width="198" height="122" rx="18" fill="#0F172A" fill-opacity="0.86" stroke="#A78BFA" stroke-opacity="0.38"/>
        <circle cx="28" cy="28" r="14" fill="#8B5CF6" fill-opacity="0.24"/>
        <text x="28" y="33" fill="#C4B5FD" font-size="14" font-weight="750" text-anchor="middle">3</text>
        <text x="20" y="67" fill="#F8FAFC" font-size="16" font-weight="700">React result UI</text>
        <text x="20" y="91" fill="#94A3B8" font-size="12">Closed Shadow DOM</text>
        <text x="20" y="108" fill="#94A3B8" font-size="12">Typed scan state</text>
      </g>
      <g transform="translate(714 157)">
        <rect width="198" height="122" rx="18" fill="#0F172A" fill-opacity="0.86" stroke="#A78BFA" stroke-opacity="0.38"/>
        <circle cx="28" cy="28" r="14" fill="#8B5CF6" fill-opacity="0.24"/>
        <text x="28" y="33" fill="#C4B5FD" font-size="14" font-weight="750" text-anchor="middle">4</text>
        <text x="20" y="67" fill="#F8FAFC" font-size="16" font-weight="700">Dedicated worker</text>
        <text x="20" y="91" fill="#94A3B8" font-size="12">Canvas preprocessing</text>
        <text x="20" y="108" fill="#94A3B8" font-size="12">Contract assertions</text>
      </g>
      <g transform="translate(936 157)">
        <rect width="216" height="122" rx="18" fill="#0F172A" fill-opacity="0.86" stroke="#C084FC" stroke-opacity="0.45"/>
        <circle cx="28" cy="28" r="14" fill="#A855F7" fill-opacity="0.24"/>
        <text x="28" y="33" fill="#D8B4FE" font-size="14" font-weight="750" text-anchor="middle">5</text>
        <text x="20" y="67" fill="#F8FAFC" font-size="16" font-weight="700">DINOv2-S/14 INT8</text>
        <text x="20" y="91" fill="#94A3B8" font-size="12">ONNX Runtime Web</text>
        <text x="20" y="108" fill="#94A3B8" font-size="12">WASM inference</text>
      </g>
    </g>

    <g fill="none" stroke="url(#line)" stroke-width="2.5" marker-end="url(#arrow)">
      <path d="M246 218H262"/>
      <path d="M468 218H484"/>
      <path d="M690 218H706"/>
      <path d="M912 218H928"/>
    </g>

    <path d="M1044 280V324H739" fill="none" stroke="#C084FC" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="1044" y="308" fill="#D8B4FE" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">ONE LOGIT</text>

    <g transform="translate(48 340)">
      <rect width="1104" height="132" rx="20" fill="#0B1220" fill-opacity="0.82" stroke="#FFFFFF" stroke-opacity="0.1"/>
      <text x="22" y="30" fill="#CBD5E1" font-size="12" font-weight="750" letter-spacing="1.2">CALIBRATED THREE-STATE VERDICT</text>
      <rect x="22" y="48" width="326" height="62" rx="14" fill="#0F2D2B" stroke="#2DD4BF" stroke-opacity="0.45"/>
      <text x="42" y="75" fill="#5EEAD4" font-size="15" font-weight="720">Likely authentic</text>
      <text x="42" y="97" fill="#99F6E4" font-size="12">score below 0.2102</text>
      <rect x="389" y="48" width="326" height="62" rx="14" fill="#31240B" stroke="#FBBF24" stroke-opacity="0.45"/>
      <text x="409" y="75" fill="#FCD34D" font-size="15" font-weight="720">Inconclusive</text>
      <text x="409" y="97" fill="#FDE68A" font-size="12">score from 0.2102 to 0.6482</text>
      <rect x="756" y="48" width="326" height="62" rx="14" fill="#351328" stroke="#F472B6" stroke-opacity="0.45"/>
      <text x="776" y="75" fill="#F9A8D4" font-size="15" font-weight="720">Likely AI generated</text>
      <text x="776" y="97" fill="#FBCFE8" font-size="12">score above 0.6482</text>
      <rect x="22" y="118" width="1060" height="3" rx="1.5" fill="url(#score)" opacity="0.9"/>
    </g>

    <g transform="translate(48 498)">
      <rect width="530" height="78" rx="17" fill="#0F172A" fill-opacity="0.76" stroke="#38BDF8" stroke-opacity="0.25" stroke-dasharray="5 6"/>
      <text x="20" y="30" fill="#7DD3FC" font-size="12" font-weight="750" letter-spacing="1">SUPPORTING EVIDENCE</text>
      <text x="20" y="55" fill="#CBD5E1" font-size="14">Regional crop scores build the visual evidence map</text>
      <rect x="602" width="502" height="78" rx="17" fill="#0F172A" fill-opacity="0.76" stroke="#C084FC" stroke-opacity="0.25" stroke-dasharray="5 6"/>
      <text x="622" y="30" fill="#D8B4FE" font-size="12" font-weight="750" letter-spacing="1">OPTIONAL INVESTIGATION</text>
      <text x="622" y="55" fill="#CBD5E1" font-size="14">Ten forensic tools provide context, not extra votes</text>
    </g>
  </g>

  <rect x="0.75" y="0.75" width="1198.5" height="618.5" rx="27.25" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1.5"/>
</svg>
